<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#efede8" />
    <meta
      name="description"
      content="Generate unique printable educational games - bingo, word search, crossword, maze, sudoku, flash cards and more. Works entirely offline."
    />
    <title>Printable Games Generator</title>
    <script>
      /*
       * Resolve the theme before first paint. Deferring this to React would
       * show the light palette for a frame on a dark device. Mirrors
       * src/utils/theme.ts - keep the storage key and colours in step.
       */
      (function () {
        try {
          var stored = localStorage.getItem('pgg.theme.v1')
          var mode = stored === 'light' || stored === 'dark' ? stored : 'system'
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#0c0c0f' : '#efede8')
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
